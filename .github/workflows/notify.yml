name: notify
on:
  workflow_run:
    workflows: [CI, security]
    types: [completed]

jobs:
  discord:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Post to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REPO: ${{ github.event.workflow_run.repository.full_name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          WF: ${{ github.event.workflow_run.name }}
          RID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -eo pipefail
          prev=""
          if [ "$CONCLUSION" = "success" ]; then
            prev=$(gh api "repos/$REPO/actions/runs?branch=$BRANCH&status=completed&per_page=10" \
              --jq "[.workflow_runs[] | select(.name==\"$WF\" and (.id|tostring)!=\"$RID\")][0].conclusion" 2>/dev/null || true)
          fi
          msg=""
          if [ "$CONCLUSION" = "failure" ]; then
            msg="❌ **CI échouée** — $REPO ($BRANCH) — $RUN_URL"
          elif [ "$CONCLUSION" = "success" ] && [ "$prev" = "failure" ]; then
            msg="✅ **CI réparée** — $REPO ($BRANCH) est repassé au vert — $RUN_URL"
          fi
          if [ -n "$msg" ]; then
            payload=$(jq -n --arg c "$msg" '{content: $c}')
            curl -sf -H "Content-Type: application/json" -d "$payload" "$WEBHOOK"
          else
            echo "Rien à notifier (conclusion=$CONCLUSION, prev=$prev)."
          fi
