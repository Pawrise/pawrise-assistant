[project]
name = "pawrise-assistant"
version = "0.1.0"
description = "Assistant conversationnel de Pawrise Care : la moitié réactive du Care Engine."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "langgraph>=1.2.14",
    "openai>=3.26.1",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.15.0",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dev = "pawrise_assistant.dev:main"
fake-core-api = "pawrise_assistant.core_api.fake_app:main"
evals = "pawrise_assistant.evals:main"
ingest = "pawrise_assistant.wiring:ingest_main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["RUF001", "RUF002", "RUF003", "PT018"]

[tool.mypy]
strict = true
python_version = "3.13"
packages = ["pawrise_assistant"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["sse_starlette.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["pawrise_assistant"]
branch = true
omit = ["*/dev.py", "*/fake_app.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff.lint.pycodestyle]
max-line-length = 110
